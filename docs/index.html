<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Web Tools</title>

  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 800px;
      margin: 60px auto;
      padding: 0 20px;
      line-height: 1.6;
      color: #222;
    }

    h1 {
      margin-bottom: 8px;
    }

    .tools {
      margin-top: 24px;
    }

    .tool {
      display: block;
      padding: 16px;
      margin: 16px 0;
      border: 1px solid #ddd;
      border-radius: 10px;
      color: inherit;
      text-decoration: none;
      transition: background 0.2s, border-color 0.2s;
    }

    .tool:hover {
      background: #f5f5f5;
      border-color: #999;
    }

    .tool strong {
      display: block;
      font-size: 1.1rem;
    }

    .tool span {
      color: #666;
      font-size: 0.9rem;
    }
  </style>
</head>

<body>
  <h1>My Web Tools</h1>
  <p>Welcome to my collection of web tools.</p>

  <main class="tools">
    <a class="tool" href="https://hclpandv.github.io/web-tools/flowchart.html">
      <strong>Flowchart</strong>
      <span>Create and explore flowcharts.</span>
    </a>

    <a class="tool" href="https://hclpandv.github.io/web-tools/graph-lab.html">
      <strong>GraphLab</strong>
      <span>Explore equations and visualize mathematical graphs in 2D and 3D.</span>
    </a>
  </main>
</body>
</html>
