
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Tools</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 800px;
      margin: 60px auto;
      padding: 0 20px;
      line-height: 1.6;
      color: #222;
    }

    h1 {
      margin-bottom: 8px;
    }

    .tool {
      display: block;
      padding: 16px;
      margin: 16px 0;
      border: 1px solid #ddd;
      border-radius: 10px;
      color: inherit;
      text-decoration: none;
    }

    .tool:hover {
      background: #f5f5f5;
      border-color: #999;
    }

    .tool strong {
      display: block;
      font-size: 1.1rem;
    }

    .tool span {
      color: #666;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <h1>My Web Tools</h1>
  <p>Welcome to my collection of web tools.</p>

  <ul>
    <li>
      <a href="https://hclpandv.github.io/web-tools/flowchart.html">
        Flowchart
      </a>
    </li>
  </ul>
</body>
</html>
