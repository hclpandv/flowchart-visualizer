<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Tools</title>
  <meta name="description" content="Small free browser tools: turn a YAML file into an interactive flowchart, and plot equations in 2D and 3D.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🧰%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #fbfcfd;
      --text: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      --card: #ffffff;
      --teal: #0f766e;
      --indigo: #4f46e5;
      --amber: #b45309;
      --rose: #be185d;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b1017;
        --text: #f1f5f9;
        --muted: #94a3b8;
        --line: #1f2a37;
        --card: #111923;
        --teal: #2dd4bf;
        --indigo: #a5b4fc;
        --amber: #fbbf24;
        --rose: #f9a8d4;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
      color: var(--text);
      background: var(--bg);
    }
    .wrap { max-width: 860px; margin: 0 auto; padding: 80px 24px 48px; }
    h1 { margin: 0 0 8px; font-size: clamp(2.2rem, 7vw, 3.2rem); font-weight: 800; letter-spacing: -0.03em; line-height: 1.1; }
    .lede { margin: 0 0 28px; color: var(--muted); font-size: 1.1rem; }

    /* Category colours. To add a category, add a class here with a colour variable. */
    .cat-diagram { --c: var(--teal); }
    .cat-math    { --c: var(--indigo); }
    .cat-dev     { --c: var(--amber); }
    .cat-text    { --c: var(--rose); }

    .legend { display: flex; flex-wrap: wrap; gap: 8px 20px; margin: 0 0 28px; padding: 0; list-style: none; font-size: 0.9rem; color: var(--muted); }
    .legend li { display: flex; align-items: center; gap: 8px; }
    .legend i { width: 10px; height: 10px; border-radius: 3px; background: var(--c); }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; counter-reset: tool; }
    .tile {
      position: relative;
      counter-increment: tool;
      display: flex;
      flex-direction: column;
      aspect-ratio: 1;
      padding: 12px 14px 14px;
      color: var(--text);
      text-decoration: none;
      background: color-mix(in srgb, var(--c) 9%, var(--card));
      border: 1px solid color-mix(in srgb, var(--c) 35%, var(--line));
      border-radius: 12px;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .tile:hover { transform: translateY(-2px); box-shadow: 0 6px 18px color-mix(in srgb, var(--c) 22%, transparent); }
    .tile:focus-visible { outline: 2px solid var(--c); outline-offset: 3px; }
    .num { font-size: 0.75rem; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--c); }
    .num::before { content: counter(tool, decimal-leading-zero); }
    .sym { margin-top: auto; font-size: 2.3rem; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
    .name { font-size: 0.9rem; font-weight: 600; }

    /* Empty slot: invites a new tool, like an undiscovered element. */
    .tile.add {
      counter-increment: none;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: var(--muted);
      text-align: center;
      font-size: 0.85rem;
      background: transparent;
      border: 1px dashed var(--line);
    }
    .tile.add b { font-size: 1.8rem; font-weight: 400; line-height: 1; }
    .tile.add:hover { color: var(--text); box-shadow: none; border-color: var(--muted); }

    /* Hover / focus details: the short description slides over the tile. */
    .desc {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 14px;
      font-size: 0.85rem;
      line-height: 1.4;
      border-radius: inherit;
      background: color-mix(in srgb, var(--c) 16%, var(--card));
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s;
    }
    .desc::after { content: "Open \203A"; font-weight: 600; color: var(--c); }
    .tile:hover .desc, .tile:focus-visible .desc { opacity: 1; }

    /* Touch screens have no hover, so show the description under the name. */
    @media (hover: none) {
      .tile { aspect-ratio: auto; min-height: 150px; }
      .sym { margin-top: 14px; }
      .desc { position: static; display: block; padding: 4px 0 0; opacity: 1; background: none; color: var(--muted); font-size: 0.8rem; }
      .desc::after { content: none; }
    }
    footer { margin-top: 48px; font-size: 0.9rem; color: var(--muted); }
    footer a { color: var(--muted); text-underline-offset: 3px; }
    footer a:hover { color: var(--text); }

    @media (prefers-reduced-motion: reduce) {
      .tile, .desc { transition: none; }
      .tile:hover { transform: none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Small tools, big shortcuts.</h1>
    <p class="lede">Free, instant and right in your browser. No install, no sign-up.</p>

    <ul class="legend">
      <li class="cat-diagram"><i></i>Diagrams</li>
      <li class="cat-math"><i></i>Math</li>
      <!-- Add a legend item when you use a new category:
      <li class="cat-dev"><i></i>Developer</li> -->
    </ul>

    <main class="grid">

      <a class="tile cat-diagram" href="flowchart.html">
        <span class="num"></span>
        <span class="sym">Fl</span>
        <span class="name">Flowchart</span>
        <span class="desc">Turn a YAML file into an interactive flowchart.</span>
      </a>

      <a class="tile cat-math" href="graph-lab.html">
        <span class="num"></span>
        <span class="sym">Gl</span>
        <span class="name">GraphLab</span>
        <span class="desc">Plot equations in 2D and 3D.</span>
      </a>

      <!--
        ADD A NEW TOOL: copy the block below, remove the comment marks, and paste it above this note.
        1. href: the page file (for example my-tool.html)
        2. class: pick a category: cat-diagram, cat-math, cat-dev or cat-text
        3. .desc: one short sentence describing the tool (shown on hover)
        4. .sym: a two letter symbol, .name: the tool name
        The number is added automatically.

      <a class="tile cat-dev" href="my-tool.html">
        <span class="num"></span>
        <span class="sym">Mt</span>
        <span class="name">My Tool</span>
        <span class="desc">What the tool does.</span>
      </a>
      -->

      <a class="tile add" href="https://github.com/hclpandv/web-tools/issues/new">
        <b>+</b>
        <span>Suggest a tool</span>
      </a>

    </main>

    <footer>
      <a href="https://github.com/hclpandv/web-tools">Source on GitHub</a>
    </footer>
  </div>
</body>
</html>
