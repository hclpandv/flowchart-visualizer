
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mini Notes - Your Sticky Notes</title>

    <style>
        /* ---------- 1. General page styling ---------- */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Trebuchet MS", system-ui, sans-serif;
            color: #263449;
            background-color: #faf7ef;
            background-image: radial-gradient(
                #e5dfd0 0.7px,
                transparent 0.7px
            );
            background-size: 18px 18px;
        }

        .container {
            width: min(1000px, 92%);
            margin: 40px auto;
        }

        /* ---------- 2. Page header ---------- */

        header {
            text-align: center;
            margin-bottom: 36px;
        }

        header h1 {
            display: inline-block;
            margin: 0 0 12px;
            padding: 8px 24px;
            background: #ffe982;
            box-shadow: 3px 5px 0 #e9d36c;
            transform: rotate(-1deg);
            font-size: clamp(2rem, 6vw, 3.2rem);
        }

        header p {
            color: #667085;
            margin: 12px 0;
        }

        /* ---------- 3. Create-note form ---------- */

        .card {
            position: relative;
            padding: 26px;
            background: #fff0a6;
            box-shadow: 3px 7px 14px #463b201c;
            transform: rotate(-0.3deg);
        }

        .card::before {
            content: "";
            position: absolute;
            top: -10px;
            left: 28px;
            width: 64px;
            height: 22px;
            background: #f49b9b;
            opacity: 0.85;
            transform: rotate(-8deg);
        }

        h2 {
            margin-top: 0;
            font-size: 1.45rem;
        }

        form {
            display: grid;
            gap: 10px;
        }

        label {
            font-weight: 700;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            font: inherit;
            color: #263449;
            background: #fffdf4;
            border: 1px solid #d5c987;
            border-radius: 5px;
        }

        textarea {
            resize: vertical;
        }

        input:focus,
        textarea:focus {
            outline: 2px solid #78a9ef;
            border-color: #5489d9;
        }

        button {
            width: fit-content;
            padding: 10px 18px;
            border: 0;
            border-radius: 5px;
            background: #78c8f5;
            color: #173653;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 2px 3px 0 #5ba8d6;
            transition: transform 0.15s, box-shadow 0.15s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 2px 5px 0 #5ba8d6;
        }

        button:focus-visible {
            outline: 3px solid #245edb;
            outline-offset: 3px;
        }

        #message {
            min-height: 1.5em;
            margin: 4px 0 0;
            color: #475467;
        }

        /* ---------- 4. Sticky-note grid ---------- */

        .notes-section {
            margin-top: 42px;
        }

        .notes-section > h2 {
            display: table;
            padding-bottom: 5px;
            border-bottom: 3px solid #263449;
        }

        #notes-list {
            display: grid;
            grid-template-columns: repeat(
                auto-fit,
                minmax(min(100%, 240px), 1fr)
            );
            gap: 24px;
            align-items: start;
            padding: 10px 4px 20px;
        }

        /* ---------- 5. Individual sticky notes ---------- */

        .note {
            position: relative;
            min-height: 220px;
            padding: 25px 22px 55px;
            background: var(--note-color, #fff0a6);
            box-shadow: 3px 7px 13px #463b2020;
            overflow-wrap: anywhere;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        /* Give notes different colours and rotations. */

        .note:nth-child(4n + 1) {
            --note-color: #fff0a6;
            transform: rotate(-1.5deg);
        }

        .note:nth-child(4n + 2) {
            --note-color: #c8ebff;
            transform: rotate(1.2deg);
        }

        .note:nth-child(4n + 3) {
            --note-color: #d9f5d0;
            transform: rotate(-0.8deg);
        }

        .note:nth-child(4n) {
            --note-color: #ffd9e4;
            transform: rotate(1.5deg);
        }

        .note:hover {
            transform: rotate(0deg) translateY(-4px);
            box-shadow: 5px 12px 18px #463b2030;
        }

        /* Decorative tape on each note. */

        .note::before {
            content: "";
            position: absolute;
            top: -8px;
            left: 50%;
            width: 65px;
            height: 19px;
            transform: translateX(-50%) rotate(-3deg);
            background: #f6b7b7;
            opacity: 0.85;
        }

        .note:nth-child(4n + 2)::before {
            background: #b9d6ff;
        }

        .note:nth-child(4n + 3)::before {
            background: #bce6ad;
        }

        .note:nth-child(4n)::before {
            background: #f4b4d0;
        }

        .note h3 {
            margin: 4px 0 14px;
            font-size: 1.3rem;
            line-height: 1.35;
        }

        .note p {
            margin: 0 0 20px;
            white-space: pre-wrap;
            line-height: 1.65;
        }

        .note small {
            position: absolute;
            left: 22px;
            bottom: 17px;
            right: 80px;
            color: #667085;
            font-size: 0.72rem;
        }

        .note .delete-button {
            position: absolute;
            right: 14px;
            bottom: 10px;
            padding: 5px 9px;
            background: #fff5f3;
            color: #b42318;
            box-shadow: none;
            border: 1px solid #efb4ad;
            font-size: 0.85rem;
        }

        .note .delete-button:hover {
            background: #ffe1dd;
        }

        .empty-state {
            color: #667085;
            padding: 12px 0;
        }

        /* ---------- 6. Mobile layout ---------- */

        @media (max-width: 480px) {
            .container {
                margin: 24px auto;
            }

            .card {
                padding: 22px 16px;
            }

            #notes-list {
                gap: 22px;
            }

            .note {
                min-height: 190px;
            }
        }
    </style>
</head>

<body>
    <main class="container">

        <!-- Page heading -->
        <header>
            <h1>📝 Mini Notes</h1>
            <p>Your little corner for big ideas.</p>
        </header>

        <!-- Form for creating notes -->
        <section class="card">
            <h2>✏️ Create a note</h2>

            <form id="note-form">
                <label for="title">Title</label>
                <input
                    id="title"
                    type="text"
                    maxlength="200"
                    placeholder="What is this note about?"
                    required
                >

                <label for="body">Your note</label>
                <textarea
                    id="body"
                    rows="4"
                    maxlength="5000"
                    placeholder="Write something..."
                    required
                ></textarea>

                <button type="submit">＋ Save note</button>

                <p id="message" role="status" aria-live="polite"></p>
            </form>
        </section>

        <!-- Saved notes appear here -->
        <section class="notes-section">
            <h2>📌 Your notes</h2>

            <div id="notes-list">
                <p class="empty-state">Loading your notes...</p>
            </div>
        </section>

    </main>

    <script>
        // ---------- 7. Get the HTML elements ----------

        const form = document.querySelector("#note-form");
        const titleInput = document.querySelector("#title");
        const bodyInput = document.querySelector("#body");
        const message = document.querySelector("#message");
        const notesList = document.querySelector("#notes-list");

        // This is the key used to store notes in the browser.
        const STORAGE_KEY = "mini-notes";

        // ---------- 8. Read and save browser storage ----------

        function getNotes() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);

                if (!saved) {
                    return [];
                }

                const notes = JSON.parse(saved);

                return Array.isArray(notes) ? notes : [];
            } catch (error) {
                message.textContent =
                    "Could not read saved notes. Browser storage may be unavailable.";
                return [];
            }
        }

        function saveNotes(notes) {
            try {
                localStorage.setItem(
                    STORAGE_KEY,
                    JSON.stringify(notes)
                );
                return true;
            } catch (error) {
                message.textContent =
                    "Could not save notes. Browser storage may be full or unavailable.";
                return false;
            }
        }

        // ---------- 9. Display the notes ----------

        function renderNotes() {
            const notes = getNotes();

            // Remove the old display before drawing it again.
            notesList.replaceChildren();

            if (notes.length === 0) {
                const empty = document.createElement("p");
                empty.className = "empty-state";
                empty.textContent =
                    "No notes yet. Create your first one above! ✨";

                notesList.append(empty);
                return;
            }

            // Show the newest note first.
            for (const note of [...notes].reverse()) {
                const card = document.createElement("article");
                card.className = "note";

                const title = document.createElement("h3");
                title.textContent = note.title;

                const body = document.createElement("p");
                body.textContent = note.body;

                const created = document.createElement("small");
                created.textContent = "📅 " + note.createdAt;

                const deleteButton = document.createElement("button");
                deleteButton.type = "button";
                deleteButton.className = "delete-button";
                deleteButton.textContent = "🗑 Delete";
                deleteButton.setAttribute(
                    "aria-label",
                    "Delete note: " + note.title
                );

                deleteButton.addEventListener("click", () => {
                    deleteNote(note.id);
                });

                card.append(title, body, created, deleteButton);
                notesList.append(card);
            }
        }

        // ---------- 10. Create a new note ----------

        form.addEventListener("submit", (event) => {
            event.preventDefault();

            const title = titleInput.value.trim();
            const body = bodyInput.value.trim();

            if (!title || !body) {
                message.textContent =
                    "Please enter both a title and a note.";
                return;
            }

            const notes = getNotes();

            const newNote = {
                id: crypto.randomUUID
                    ? crypto.randomUUID()
                    : Date.now().toString() + Math.random().toString(16).slice(2),
                title: title,
                body: body,
                createdAt: new Date().toLocaleString()
            };

            notes.push(newNote);

            if (saveNotes(notes)) {
                form.reset();
                message.textContent = "Note saved! ✨";
                renderNotes();
            }
        });

        // ---------- 11. Delete a note ----------

        function deleteNote(id) {
            const notes = getNotes();
            const remainingNotes = notes.filter(
                note => note.id !== id
            );

            if (saveNotes(remainingNotes)) {
                message.textContent = "Note deleted.";
                renderNotes();
            }
        }

        // ---------- 12. Load notes when the page opens ----------

        renderNotes();
    </script>
</body>
</html>
