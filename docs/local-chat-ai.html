<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LocalChatAi</title>
<style>
:root{--bg:#eef1ee;--panel:#e3e8e3;--ink:#1c2421;--mute:#5f6b65;--line:#c9d1ca;--accent:#2f6f5e;--accent-ink:#fff;--user:#d5e3dc;--code:#1c2421;--code-ink:#e6efe9;--err:#b3382c;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#151a18;--panel:#1d2421;--ink:#e3ebe6;--mute:#8d9b93;--line:#2c3631;--accent:#6fbf a8;--accent:#6fbfa8;--accent-ink:#0f1a16;--user:#233a32;--code:#0e1210;--code-ink:#dbe7e0;--err:#e5867b;color-scheme:dark}}
:root[data-theme=dark]{--bg:#151a18;--panel:#1d2421;--ink:#e3ebe6;--mute:#8d9b93;--line:#2c3631;--accent:#6fbfa8;--accent-ink:#0f1a16;--user:#233a32;--code:#0e1210;--code-ink:#dbe7e0;--err:#e5867b;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 10px}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%}
aside{width:250px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;flex-shrink:0}
.brand{padding:14px 14px 0;font:600 18px Georgia,serif;letter-spacing:.2px}
aside .top{padding:12px;display:flex;gap:8px}
#list{flex:1;overflow:auto;padding:0 8px 8px}
.chat-item{display:flex;align-items:center;gap:4px;padding:7px 8px;border-radius:6px;cursor:pointer}
.chat-item span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-item.on{background:var(--bg)}
.chat-item button{border:0;background:none;padding:0 4px;color:var(--mute);visibility:hidden}
.chat-item:hover button{visibility:visible}
main{flex:1;display:flex;flex-direction:column;min-width:0}
header{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
header select{max-width:260px}
header .sp{flex:1}
#status{font-size:13px;color:var(--mute)}
#status.bad{color:var(--err)}
#msgs{flex:1;overflow:auto;padding:20px 14px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.msg{display:flex;flex-direction:column;gap:4px}
.msg .who{font-size:12px;color:var(--mute);display:flex;gap:10px}
.msg .who button{border:0;background:none;padding:0;color:var(--mute);font-size:12px}
.msg .who button:hover{color:var(--accent)}
.msg .body{white-space:pre-wrap;word-wrap:break-word}
.msg.assistant .body{font:16.5px/1.65 "Iowan Old Style","Palatino Linotype",Georgia,serif}
.msg.user .body{background:var(--user);padding:8px 12px;border-radius:10px;align-self:flex-end;max-width:90%}
.msg.user .who{align-self:flex-end}
.body pre{background:var(--code);color:var(--code-ink);padding:10px 12px;border-radius:8px;overflow-x:auto;position:relative;margin:8px 0;font:13px/1.5 ui-monospace,Consolas,monospace;white-space:pre}
.body pre button{position:absolute;top:6px;right:6px;font-size:11px;padding:2px 6px;background:transparent;color:var(--code-ink);border-color:#556}
.body code{font:0.88em ui-monospace,Consolas,monospace;background:var(--panel);padding:1px 4px;border-radius:4px}
.body pre code{background:none;padding:0}
.empty{margin:12vh auto 0;max-width:420px;text-align:center;color:var(--mute)}
.empty b{display:block;font:600 22px Georgia,serif;color:var(--ink);margin-bottom:6px}
footer{padding:10px 14px 14px}
.composer{max-width:760px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
.composer textarea{resize:none;max-height:200px;min-height:42px}
#panel{position:fixed;right:0;top:0;bottom:0;width:min(360px,100%);background:var(--panel);border-left:1px solid var(--line);padding:16px;overflow:auto;transform:translateX(100%);transition:transform .2s;z-index:5}
#panel.open{transform:none}
#panel label{display:block;font-size:13px;color:var(--mute);margin:12px 0 4px}
#panel .row{display:flex;justify-content:space-between;align-items:center}
#panel .hint{font-size:12px;color:var(--mute);margin-top:3px}
.val{color:var(--ink);font-variant-numeric:tabular-nums}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
@media (max-width:700px){aside{position:fixed;inset:0 auto 0 0;z-index:4;transform:translateX(-100%);transition:transform .2s}aside.open{transform:none}#menu{display:inline-block!important}}
#menu{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<aside id="side">
  <div class="brand">LocalChatAi</div>
  <div class="top"><button class="primary" id="new" style="flex:1">New chat</button></div>
  <div id="list"></div>
</aside>
<main>
  <header>
    <button id="menu" aria-label="Chats">☰</button>
    <select id="model" aria-label="Model"></select>
    <span id="status"></span>
    <span class="sp"></span>
    <button id="settings">Settings</button>
  </header>
  <div id="msgs"><div class="wrap" id="wrap"></div></div>
  <footer>
    <div class="composer">
      <textarea id="input" rows="1" placeholder="Message the model. Enter to send, Shift+Enter for a new line."></textarea>
      <button class="primary" id="send">Send</button>
    </div>
  </footer>
</main>

<div id="panel" aria-label="Settings">
  <div class="row"><b>Settings</b><button id="close">Close</button></div>
  <label for="sys">System prompt (this chat)</label>
  <textarea id="sys" rows="6" placeholder="e.g. You are a concise assistant that answers in plain language."></textarea>
  <label for="preset">Prompt preset</label>
  <select id="preset"></select>
  <label for="endpoint">Ollama URL</label>
  <input id="endpoint" placeholder="http://localhost:11434">
  <label><span class="row"><span>Temperature</span><span class="val" id="tv"></span></span></label>
  <input type="range" id="temp" min="0" max="2" step="0.05">
  <label><span class="row"><span>Top P</span><span class="val" id="pv"></span></span></label>
  <input type="range" id="topp" min="0" max="1" step="0.05">
  <label for="ctx">Context length (num_ctx)</label>
  <input type="number" id="ctx" min="512" step="512" placeholder="model default">
  <label for="maxtok">Max tokens (num_predict)</label>
  <input type="number" id="maxtok" min="-1" placeholder="model default">
  <label for="seed">Seed</label>
  <input type="number" id="seed" placeholder="random">
  <label for="keep">Keep model loaded</label>
  <input id="keep" placeholder="5m (e.g. 30m, 0 to unload)">
  <label for="theme">Theme</label>
  <select id="theme"><option value="auto">Match system</option><option value="light">Light</option><option value="dark">Dark</option></select>
  <div class="hint">Settings are saved in this browser. The system prompt is saved per chat.</div>
  <div class="btns">
    <button id="exp-md">Export Markdown</button>
    <button id="exp-json">Export JSON</button>
    <button id="clear">Clear chat</button>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const PRESETS={"None":"","Concise helper":"You are a concise assistant. Answer directly and keep replies short unless asked for detail.","Code reviewer":"You are a careful senior code reviewer. Point out bugs, risks and improvements, and show corrected code.","Explain simply":"Explain things step by step in plain language, using small examples."};
const DEF={endpoint:"http://localhost:11434",temp:0.8,topp:0.9,ctx:"",maxtok:"",seed:"",keep:"",theme:"auto",model:""};
const load=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
let cfg={...DEF,...load("oc.cfg",{})};
let chats=load("oc.chats",[]);
let cur=load("oc.cur",null);
let ctrl=null;

function newChat(){const c={id:Date.now().toString(36),title:"New chat",system:"",msgs:[]};chats.unshift(c);cur=c.id;persist();render()}
function chat(){return chats.find(c=>c.id===cur)}
function persist(){save("oc.chats",chats);save("oc.cur",cur);save("oc.cfg",cfg)}

function esc(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
function md(t){
  const parts=t.split(/```/);
  return parts.map((p,i)=>{
    if(i%2){const nl=p.indexOf("\n");const code=nl>-1?p.slice(nl+1):p;return `<pre><button data-copy>Copy</button><code>${esc(code.replace(/\n$/,""))}</code></pre>`}
    return esc(p).replace(/`([^`\n]+)`/g,"<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g,"<b>$1</b>").replace(/(^|\s)\*([^*\n]+)\*/g,"$1<i>$2</i>");
  }).join("");
}

function render(){
  const list=$("list");list.innerHTML="";
  chats.forEach(c=>{
    const d=document.createElement("div");d.className="chat-item"+(c.id===cur?" on":"");
    d.innerHTML=`<span>${esc(c.title)}</span><button aria-label="Delete chat">✕</button>`;
    d.onclick=e=>{if(e.target.tagName==="BUTTON"){chats=chats.filter(x=>x.id!==c.id);if(cur===c.id)cur=chats[0]?.id||null;if(!cur)return newChat();persist();render()}else{cur=c.id;persist();render();$("side").classList.remove("open")}};
    list.appendChild(d);
  });
  const c=chat();const w=$("wrap");w.innerHTML="";
  $("sys").value=c.system||"";
  if(!c.msgs.length){w.innerHTML=`<div class="empty"><b>Talk to a local model</b>Pick a model above, set a system prompt in Settings if you want one, and start typing.</div>`}
  c.msgs.forEach((m,i)=>w.appendChild(msgEl(m,i)));
  scrollDown();
}
function msgEl(m,i){
  const d=document.createElement("div");d.className="msg "+m.role;
  const last=i===chat().msgs.length-1;
  d.innerHTML=`<div class="who"><span>${m.role==="user"?"You":(m.model||"Assistant")}</span>${m.role==="assistant"?'<button data-act="copy">Copy</button>':""}${m.role==="assistant"&&last?'<button data-act="regen">Regenerate</button>':""}${m.role==="user"?'<button data-act="edit">Edit</button>':""}</div><div class="body">${m.role==="user"?esc(m.content):md(m.content)}</div>`;
  d.dataset.i=i;return d;
}
function scrollDown(){const m=$("msgs");m.scrollTop=m.scrollHeight}
function setStatus(t,bad){const s=$("status");s.textContent=t;s.className=bad?"bad":""}

async function models(){
  try{
    const r=await fetch(cfg.endpoint+"/api/tags");const j=await r.json();
    const sel=$("model");sel.innerHTML="";
    j.models.forEach(m=>{const o=document.createElement("option");o.value=o.textContent=m.name;sel.appendChild(o)});
    if(!j.models.length){setStatus("No models installed. Run: ollama pull llama3.2",true);return}
    sel.value=j.models.some(m=>m.name===cfg.model)?cfg.model:j.models[0].name;cfg.model=sel.value;
    setStatus("Connected");
  }catch(e){
    $("model").innerHTML="";
    setStatus("Can't reach Ollama at "+cfg.endpoint+". Is it running with OLLAMA_ORIGINS=* ?",true);
  }
}

async function generate(){
  const c=chat();if(ctrl||!cfg.model)return;
  const asst={role:"assistant",content:"",model:cfg.model};c.msgs.push(asst);render();
  const body=$("wrap").lastChild.querySelector(".body");
  const opts={temperature:+cfg.temp,top_p:+cfg.topp};
  if(cfg.ctx)opts.num_ctx=+cfg.ctx;if(cfg.maxtok)opts.num_predict=+cfg.maxtok;if(cfg.seed!=="")opts.seed=+cfg.seed;
  const msgs=[];if(c.system.trim())msgs.push({role:"system",content:c.system});
  c.msgs.slice(0,-1).forEach(m=>msgs.push({role:m.role,content:m.content}));
  const req={model:cfg.model,messages:msgs,stream:true,options:opts};
  if(cfg.keep)req.keep_alive=/^\d+$/.test(cfg.keep)?+cfg.keep:cfg.keep;
  ctrl=new AbortController();$("send").textContent="Stop";$("send").classList.remove("primary");
  let t0=performance.now(),n=0;
  try{
    const r=await fetch(cfg.endpoint+"/api/chat",{method:"POST",body:JSON.stringify(req),signal:ctrl.signal});
    if(!r.ok)throw new Error(await r.text());
    const rd=r.body.getReader(),dec=new TextDecoder();let buf="";
    while(true){
      const {done,value}=await rd.read();if(done)break;
      buf+=dec.decode(value,{stream:true});const lines=buf.split("\n");buf=lines.pop();
      for(const l of lines){if(!l.trim())continue;const j=JSON.parse(l);
        if(j.error)throw new Error(j.error);
        if(j.message?.content){asst.content+=j.message.content;n++;body.innerHTML=md(asst.content);scrollDown()}
        if(j.done&&j.eval_count)setStatus(`${(j.eval_count/(j.eval_duration/1e9)).toFixed(1)} tokens/s`);
      }
    }
  }catch(e){
    if(e.name!=="AbortError"){asst.content+=(asst.content?"\n\n":"")+"Error: "+e.message;setStatus("Request failed",true)}
  }
  ctrl=null;$("send").textContent="Send";$("send").classList.add("primary");
  persist();render();
}

function send(){
  if(ctrl){ctrl.abort();return}
  const t=$("input").value.trim();if(!t)return;
  const c=chat();c.msgs.push({role:"user",content:t});
  if(c.title==="New chat")c.title=t.slice(0,40);
  $("input").value="";autosize();persist();generate();
}
function autosize(){const i=$("input");i.style.height="auto";i.style.height=Math.min(i.scrollHeight,200)+"px"}

$("send").onclick=send;
$("input").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}});
$("input").addEventListener("input",autosize);
$("new").onclick=()=>{newChat();$("side").classList.remove("open")};
$("menu").onclick=()=>$("side").classList.toggle("open");
$("settings").onclick=()=>$("panel").classList.toggle("open");
$("close").onclick=()=>$("panel").classList.remove("open");
$("model").onchange=e=>{cfg.model=e.target.value;persist()};
$("sys").oninput=e=>{chat().system=e.target.value;persist()};
$("clear").onclick=()=>{chat().msgs=[];persist();render()};

$("wrap").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.hasAttribute("data-copy")){navigator.clipboard.writeText(b.nextElementSibling.textContent);b.textContent="Copied";setTimeout(()=>b.textContent="Copy",1200);return}
  const i=+b.closest(".msg").dataset.i,c=chat(),a=b.dataset.act;
  if(a==="copy"){navigator.clipboard.writeText(c.msgs[i].content);b.textContent="Copied";setTimeout(()=>b.textContent="Copy",1200)}
  if(a==="regen"&&!ctrl){c.msgs.pop();persist();generate()}
  if(a==="edit"&&!ctrl){$("input").value=c.msgs[i].content;c.msgs.length=i;persist();render();autosize();$("input").focus()}
});

// settings bindings
const bind=(id,key,fmt)=>{const el=$(id);el.value=cfg[key];if(fmt)fmt(cfg[key]);el.oninput=()=>{cfg[key]=el.value;if(fmt)fmt(el.value);persist()}};
bind("endpoint","endpoint");$("endpoint").onchange=()=>{cfg.endpoint=$("endpoint").value.replace(/\/$/,"");persist();models()};
bind("temp","temp",v=>$("tv").textContent=(+v).toFixed(2));
bind("topp","topp",v=>$("pv").textContent=(+v).toFixed(2));
bind("ctx","ctx");bind("maxtok","maxtok");bind("seed","seed");bind("keep","keep");
Object.keys(PRESETS).forEach(k=>{const o=document.createElement("option");o.textContent=k;$("preset").appendChild(o)});
$("preset").onchange=e=>{const t=PRESETS[e.target.value];if(e.target.value==="None"&&!confirm("Clear the system prompt?")){return}chat().system=t;$("sys").value=t;persist()};
function applyTheme(){const t=cfg.theme;if(t==="auto")document.documentElement.removeAttribute("data-theme");else document.documentElement.dataset.theme=t}
$("theme").value=cfg.theme;$("theme").onchange=e=>{cfg.theme=e.target.value;applyTheme();persist()};applyTheme();

// export
function dl(name,text,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();URL.revokeObjectURL(a.href)}
$("exp-json").onclick=()=>dl("localchatai-chat.json",JSON.stringify(chat(),null,2),"application/json");
$("exp-md").onclick=()=>{const c=chat();let t=`# ${c.title}\n\n`;if(c.system)t+=`> System: ${c.system}\n\n`;c.msgs.forEach(m=>t+=`**${m.role==="user"?"You":(m.model||"Assistant")}:**\n\n${m.content}\n\n`);dl("localchatai-chat.md",t,"text/markdown")};

if(!chat())newChat();else render();
models();
</script>
</body>
</html>
